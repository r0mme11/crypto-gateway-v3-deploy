services:
  db:
    image: postgres:16-alpine
    container_name: cg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    # Host ports shifted to avoid clashing with a default 5432/6379 already running.
    ports:
      - '5433:5432'
    volumes:
      - cg_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cg_redis
    restart: unless-stopped
    ports:
      - '6380:6379'

  # One-off: applies migrations and seeds platform data, then exits.
  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: crypto-gateway-api:latest
    container_name: cg_migrate
    env_file:
      - .common.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: 'no'

  api:
    image: crypto-gateway-api:latest
    container_name: cg_api
    restart: unless-stopped
    env_file:
      - .common.env
      - .api.env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: node dist/apps/api/main

  admin-api:
    image: crypto-gateway-api:latest
    container_name: cg_admin_api
    restart: unless-stopped
    env_file:
      - .common.env
      - .admin-api.env
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: node dist/apps/admin-api/main

  # Deposit pipeline workers (one image, role via WORKER_TYPE).
  worker-block-scanner:
    image: crypto-gateway-api:latest
    container_name: cg_worker_scanner
    restart: unless-stopped
    env_file:
      - .common.env
    environment:
      WORKER_TYPE: block_scanner
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: node dist/apps/worker/main

  worker-checker:
    image: crypto-gateway-api:latest
    container_name: cg_worker_checker
    restart: unless-stopped
    env_file:
      - .common.env
    environment:
      WORKER_TYPE: checker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: node dist/apps/worker/main

  worker-charger:
    image: crypto-gateway-api:latest
    container_name: cg_worker_charger
    restart: unless-stopped
    env_file:
      - .common.env
    environment:
      WORKER_TYPE: charger
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: node dist/apps/worker/main

volumes:
  cg_db_data: {}
